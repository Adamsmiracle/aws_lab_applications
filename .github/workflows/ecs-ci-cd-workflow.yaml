name: Build app image and publish deploy bundle

# ---------------------------------------------------------------------------
# GitHub Actions is the "build factory" (it replaces CodeBuild). On every push
# to the lab branch it does the two things the CodeDeploy stage needs:
#   1. builds + pushes the container image to ECR
#   2. publishes the CodeDeploy files (taskdef.json + appspec.yaml) to S3,
#      but only when those files actually change (see step 4)
#
# The pipeline itself does no building — its ECR source provides the image
# identity (imageDetail.json, auto-generated) and its S3 source provides the
# deploy bundle published here.
# ---------------------------------------------------------------------------
on:
  push:
    branches:
      - todo

# id-token: mint an OIDC JWT for AWS STS (no long-lived keys).
# contents: read is the default — we no longer commit anything back to the repo.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ROLE_ARN_ECS_CI_CD: ${{ secrets.AWS_ROLE_ARN_TODO }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  # Used to derive the deploy-source bucket name (must match the infra stack):
  #   <PROJECT_NAME>-deploy-source-<ACCOUNT_ID>-<REGION>
  PROJECT_NAME: todo-app

jobs:
  build-and-push:
    name: Publish deploy bundle, build, and push to Amazon ECR
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------
      # 1. Checkout the application source (incl. taskdef.json + appspec.yaml).
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 2. Assume the IAM role in AWS via OIDC. No long-lived credentials.
      # -----------------------------------------------------------------
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN_ECS_CI_CD }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-${{ github.run_id }}

      # -----------------------------------------------------------------
      # 3. Resolve the AWS account ID (no IAM permission needed) to build
      #    the deploy-source bucket name.
      # -----------------------------------------------------------------
      - name: Resolve AWS account ID
        run: echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------
      # 4. Publish the CodeDeploy files as a small zip to the deploy-source
      #    S3 bucket (the pipeline's "AppSource"), but ONLY when they change.
      #
      #    We hash taskdef.json + appspec.yaml and store the hash as object
      #    metadata. On each run we compare against the hash on the current
      #    object: re-upload only if it differs (content changed) or the object
      #    doesn't exist yet (first run). Image-only builds skip the upload, so
      #    no needless S3 versions are created. Runs BEFORE the image push so
      #    the bundle is current when the ECR push fires the pipeline.
      #    <IMAGE1_NAME> / <TASK_DEFINITION> stay as placeholders — CodeDeploy
      #    fills them at deploy time. (-j flattens the zip so both files sit at
      #    the artifact root, where CodeDeploy expects them.)
      # -----------------------------------------------------------------
      - name: Publish deploy bundle to S3 if changed
        run: |
          set -euo pipefail
          DEPLOY_BUCKET="${PROJECT_NAME}-deploy-source-${ACCOUNT_ID}-${AWS_REGION}"
          KEY="deploy-bundle.zip"

          # Content hash of the source deploy files (not the zip — zips aren't
          # byte-stable). Stored on the object as x-amz-meta-contentsha.
          NEW_HASH="$(cat taskdef.json appspec.yaml | sha256sum | cut -d' ' -f1)"

          # Hash on the current object, or "" if the object doesn't exist.
          CUR_HASH="$(aws s3api head-object --bucket "$DEPLOY_BUCKET" --key "$KEY" \
            --query 'Metadata.contentsha' --output text 2>/dev/null || echo "")"

          if [ "$NEW_HASH" = "$CUR_HASH" ]; then
            echo "Deploy files unchanged — skipping upload (hash $NEW_HASH)."
          else
            echo "Deploy files changed or first run — publishing bundle."
            zip -j deploy-bundle.zip taskdef.json appspec.yaml
            aws s3 cp deploy-bundle.zip "s3://${DEPLOY_BUCKET}/${KEY}" \
              --metadata "contentsha=${NEW_HASH}"
            echo "Published s3://${DEPLOY_BUCKET}/${KEY}"
          fi

      # -----------------------------------------------------------------
      # 5. Authenticate Docker to the private ECR registry.
      # -----------------------------------------------------------------
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------------------------------------------
      # 6. Build and push the image. Pushing `latest` is what fires the
      #    EventBridge rule that starts the pipeline.
      # -----------------------------------------------------------------
      - name: Build, tag, and push image to ECR
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
        run: |
          docker build --tag "${IMAGE}" .
          docker push "${IMAGE}"

      # -----------------------------------------------------------------
      # 7. Summarize the run for easier auditing.
      # -----------------------------------------------------------------
      - name: Write run summary
        if: success()
        run: |
          {
            echo "### Deploy bundle + image"
            echo ""
            echo "- Deploy bundle: \`s3://${PROJECT_NAME}-deploy-source-${ACCOUNT_ID}-${AWS_REGION}/deploy-bundle.zip\` (re-uploaded only on change)"
            echo "- Image: \`${ECR_REGISTRY}/${ECR_REPOSITORY}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
