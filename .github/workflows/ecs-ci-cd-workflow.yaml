name: Build and Push Docker Image to ECR

# ---------------------------------------------------------------------------
# Trigger: every push to the deploy branch.
# ---------------------------------------------------------------------------
on:
  push:
    branches:
      - ecs-ci-cd

# ---------------------------------------------------------------------------
# Permissions: minimum required for OIDC + repo checkout.
#   - id-token: write  -> allows the workflow to mint an OIDC JWT for AWS STS.
#   - contents: read   -> allows actions/checkout to fetch the repo.
# ---------------------------------------------------------------------------
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ROLE_ARN_ECS_CI_CD: ${{ secrets.AWS_ROLE_ARN_ECS_CI_CD }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  build-and-push:
    name: Build, Tag, and Push to Amazon ECR
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------
      # 1. Checkout the application source code.
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 2. Assume the IAM role in AWS via OIDC. No long-lived credentials.
      # -----------------------------------------------------------------
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN_ECS_CI_CD }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-${{ github.run_id }}

      # -----------------------------------------------------------------
      # 3. Authenticate Docker to the private ECR registry.
      # -----------------------------------------------------------------
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------------------------------------------
      # 4. Build, tag, and push.
      #    Single tag:
      #      - latest : the pointer the CodePipeline ECR source tracks
      #    Pushing `latest` is what fires the EventBridge rule that starts
      #    the pipeline. The infra (CodeBuild) generates taskdef.json and
      #    appspec.yaml at deploy time — this workflow only ships the image.
      # -----------------------------------------------------------------
      - name: Build, tag, and push image to ECR
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
        run: |
          docker build --tag "${IMAGE}" .
          docker push "${IMAGE}"

      # -----------------------------------------------------------------
      # 5. Summarize the push in the workflow run UI for easier auditing.
      # -----------------------------------------------------------------
      - name: Write run summary
        if: success()
        run: |
          {
            echo "### Image pushed to Amazon ECR"
            echo ""
            echo "- Registry: \`${ECR_REGISTRY}\`"
            echo "- Repository: \`${ECR_REPOSITORY}\`"
            echo "- Tag: \`latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
